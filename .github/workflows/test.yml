name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s python/tests
      - run: npm test
        env:
          PITOOLS_PYTHON: ${{ steps.py.outputs.python-path }}
