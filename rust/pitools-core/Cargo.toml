[package]
name = "pitools-core"
version = "0.1.13"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.147", features = ["raw_value", "float_roundtrip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
